[project]
name = "docpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hernani Pereira", email = "X367640@bcpcorp.net" }
]
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.110.2",
    "numpy>=2.5.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docpilot = "docpilot:main"
docpilot-search = "docpilot.retrieval.semantic:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
